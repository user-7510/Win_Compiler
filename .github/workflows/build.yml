name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pillow pdf2image opencv-python pyinstaller

    - name: Download Poppler
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://github.com/ossres/poppler-windows/releases/download/v24.08.0-0/poppler-24.08.0_0.zip" -OutFile "poppler.zip"
        Expand-Archive -Path "poppler.zip" -DestinationPath "C:\poppler_tmp"
        Move-Item -Path "C:\poppler_tmp\poppler-24.08.0" -Destination "C:\poppler"

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "C:\poppler;poppler" pdf.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pdf-processor-windows
        path: dist/pdf.exe
