name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pillow pdf2image opencv-python pyinstaller

    - name: Download and Setup Poppler dynamically
      shell: python
      run: |
        import urllib.request
        import json
        import zipfile
        import os
        import shutil

        # 1. 透過 API 抓取最新版 Poppler 的真實載點
        api = "https://api.github.com/repos/oschwartz10612/poppler-windows/releases/latest"
        req = urllib.request.Request(api, headers={'User-Agent': 'Python'})
        with urllib.request.urlopen(req) as res:
            data = json.loads(res.read().decode('utf-8'))
            url = next(a['browser_download_url'] for a in data['assets'] if a['name'].endswith('.zip'))
        
        # 2. 下載並解壓縮
        urllib.request.urlretrieve(url, "pop.zip")
        with zipfile.ZipFile("pop.zip", 'r') as zf:
            zf.extractall("C:\\pop_tmp")
            
        # 3. 全自動尋找執行檔位置 (無視官方資料夾結構變化)
        bdir = None
        for root, dirs, files in os.walk("C:\\pop_tmp"):
            if "pdftoppm.exe" in files:
                bdir = root
                break
                
        # 4. 強制歸位到 C:\poppler\bin
        if os.path.exists("C:\\poppler"):
            shutil.rmtree("C:\\poppler")
        os.makedirs("C:\\poppler")
        shutil.move(bdir, "C:\\poppler\\bin")
        print("Success!")

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "C:\poppler;poppler" pdf.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pdf-processor-windows
        path: dist/pdf.exe
