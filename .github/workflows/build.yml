name: Build Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pillow pdf2image opencv-python pyinstaller

    - name: Download and Setup Poppler via Python
      shell: python
      run: |
        import urllib.request
        import zipfile
        import os
        import shutil

        # 使用絕對穩定的 GitHub Release 靜態連結
        url = "https://github.com/ossres/poppler-windows/releases/download/v24.08.0-0/poppler-24.08.0_0.zip"
        print("正在下載 Poppler...")
        urllib.request.urlretrieve(url, "poppler.zip")
        
        print("正在解壓縮...")
        with zipfile.ZipFile("poppler.zip", 'r') as zip_ref:
            zip_ref.extractall("C:\\poppler_tmp")
            
        print("正在配置目錄...")
        if os.path.exists("C:\\poppler"):
            shutil.rmtree("C:\\poppler")
        shutil.move("C:\\poppler_tmp\\poppler-24.08.0", "C:\\poppler")
        print("Poppler 設定成功！")

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --add-data "C:\poppler;poppler" pdf.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pdf-processor-windows
        path: dist/pdf.exe
